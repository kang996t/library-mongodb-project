systemLog:
  destination: file
  path: /var/log/smart_library_sharding/shard2/mongod.log
  logAppend: true

storage:
  dbPath: /var/lib/smart_library_sharding/shard2
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

processManagement:
  fork: true

net:
  port: 27212
  bindIp: 127.0.0.1,192.168.121.134

replication:
  replSetName: shard2RS

sharding:
  clusterRole: shardsvr

security:
  keyFile: /var/lib/smart_library_sharding/sharding.key
  authorization: enabled
