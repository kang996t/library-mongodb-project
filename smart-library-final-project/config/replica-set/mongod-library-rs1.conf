systemLog:
  destination: file
  path: /var/log/smart_library_rs/node1/mongod.log
  logAppend: true

storage:
  dbPath: /var/lib/smart_library_rs/node1
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

processManagement:
  fork: true

net:
  port: 27117
  bindIp: 127.0.0.1,192.168.121.134

replication:
  replSetName: libraryRS
  oplogSizeMB: 128

security:
  keyFile: /var/lib/smart_library_rs/libraryRS.key
  authorization: enabled
